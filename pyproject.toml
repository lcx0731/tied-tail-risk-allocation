[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tied-tail-risk-allocation"
version = "0.1.0"
description = "Exact finite-scenario Expected Shortfall allocation and directional sensitivity"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
tail-allocation-demo = "tail_allocation.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
